; Second instance of the same service, reading the synthetic demo corpus.
;
;   cp deploy/cv-search-demo.conf /etc/supervisor/conf.d/
;   supervisorctl reread && supervisorctl update
;
; Why a second process rather than a collection parameter on the first:
;
; The live instance on 5680 serves an index of real candidates. Adding a
; caller-supplied collection name to its search path would mean one request
; field standing between a demo query and real people's CVs. A separate process
; with the collection fixed in its own environment cannot be pointed at the
; wrong data by anything a caller sends.
;
; Same code, same venv, same Chroma container -- only CHROMA_COLLECTION and the
; port differ. Costs ~309 MB, because each instance loads its own copy of the
; ONNX model (see the one-worker note in cv-search.conf, same reason).
;
; Not in the ufw docker0 allow-list, and deliberately: n8n has no business
; posting CVs here. Reach it over an SSH tunnel:
;
;   .\deploy\cvsearch.ps1 -Ui -Port 5681
;
; To remove it entirely:
;   supervisorctl stop cv-search-demo
;   rm /etc/supervisor/conf.d/cv-search-demo.conf
;   supervisorctl reread && supervisorctl update
;   # then drop the collection if you want the disk back:
;   CHROMA_COLLECTION=cvs_demo .venv/bin/python indexer.py --reset

[program:cv-search-demo]
directory=/root/cv-semantic-search
command=/root/cv-semantic-search/.venv/bin/uvicorn api:app --host 172.17.0.1 --port 5681 --workers 1

autostart=true
autorestart=true
startsecs=15

stopasgroup=true
killasgroup=true
user=root

stdout_logfile=/var/log/cv-search-demo.out.log
stderr_logfile=/var/log/cv-search-demo.err.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=2
stderr_logfile_backups=2

; CHROMA_COLLECTION here beats the one in .env: python-dotenv's load_dotenv does
; not override variables already present in the environment. That is what keeps
; this instance off the real index without a second .env to maintain.
environment=PATH="/root/cv-semantic-search/.venv/bin:%(ENV_PATH)s",CHROMA_COLLECTION="cvs_demo"

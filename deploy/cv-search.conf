; Supervisor program for the CV search API.
;
;   cp deploy/cv-search.conf /etc/supervisor/conf.d/
;   supervisorctl reread && supervisorctl update
;
; The reread AND the update are both required. A conf change alone does nothing,
; and Supervisor will not tell you that.
;
; Note what is NOT in this file: secrets. The sibling job-runner.conf carries
; five API keys inline in its environment= line, where they sit in a
; world-readable config and get printed by `supervisorctl` diagnostics. This
; service reads a chmod 600 .env through python-dotenv instead, so the only
; thing here is the venv path.

[program:cv-search]
directory=/root/cv-semantic-search
command=/root/cv-semantic-search/.venv/bin/uvicorn api:app --host 172.17.0.1 --port 5680 --workers 1
; One worker on purpose. Each worker loads its own copy of the embedding model,
; so a second one buys concurrency this query volume does not need and costs
; memory this box does not have.

autostart=true
autorestart=true
startsecs=15
; The model loads at first request, not at import, but ONNX Runtime and the
; tokenizer still take a moment. Fifteen seconds stops Supervisor from calling a
; healthy slow start a crash loop.

stopasgroup=true
killasgroup=true
user=root

stdout_logfile=/var/log/cv-search.out.log
stderr_logfile=/var/log/cv-search.err.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_backups=3

environment=PATH="/root/cv-semantic-search/.venv/bin:%(ENV_PATH)s"
